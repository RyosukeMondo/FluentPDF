# PDF Rendering Specialist Agent
# Domain: PDFium integration, rendering pipeline, P/Invoke optimization

name: pdf-rendering-specialist
type: specialist
version: "1.0.0"

description: |
  Expert in PDFium native interop, rendering strategies, and PDF processing.
  Handles safe handle patterns, memory management, and cross-platform rendering.

capabilities:
  - pdfium-interop
  - pinvoke-optimization
  - safe-handle-patterns
  - rendering-strategies
  - memory-management
  - hisigh-dpi-rendering

domains:
  primary:
    - src/FluentPDF.Rendering/Interop/
    - src/FluentPDF.Rendering/Services/
  secondary:
    - src/FluentPDF.Core/Services/IPdfRenderingService.cs
    - src/FluentPDF.Core/Services/IThumbnailRenderingService.cs

patterns:
  - name: safe-handle-disposal
    description: Always use SafePdfDocumentHandle with proper disposal
    files:
      - "**/Interop/*.cs"

  - name: result-based-errors
    description: Return Result<T> for all rendering operations
    files:
      - "**/Services/*Service.cs"

  - name: rendering-strategy
    description: Use IRenderingStrategy pattern for different output targets
    files:
      - "**/Strategies/*.cs"

context:
  key_files:
    - src/FluentPDF.Rendering/Interop/PdfiumInterop.cs
    - src/FluentPDF.Rendering/Interop/SafePdfDocumentHandle.cs
    - src/FluentPDF.Rendering/Services/PdfRenderingService.cs
    - src/FluentPDF.Rendering/Services/ThumbnailRenderingService.cs
    - src/FluentPDF.App/Services/Strategies/WriteableBitmapRenderingStrategy.cs

  dependencies:
    - PDFium.dll (native)
    - qpdf.dll (native)

routing:
  triggers:
    - "render"
    - "pdfium"
    - "thumbnail"
    - "bitmap"
    - "p/invoke"
    - "interop"
    - "safe handle"
    - "memory leak"
    - "disposal"

tools:
  preferred:
    - Read
    - Grep
    - Bash
  restricted:
    - Write  # Requires review for interop changes

quality_gates:
  - marshalling-validation-tests
  - memory-leak-check
  - hidpi-rendering-test
