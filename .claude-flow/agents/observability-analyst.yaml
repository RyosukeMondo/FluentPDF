# Observability Analyst Agent
# Domain: Logging, metrics, telemetry, performance monitoring

name: observability-analyst
type: analyst
version: "1.0.0"

description: |
  Expert in FluentPDF's observability stack: Serilog structured logging,
  OpenTelemetry metrics/tracing, and performance monitoring.

capabilities:
  - structured-logging
  - opentelemetry-integration
  - performance-profiling
  - metrics-analysis
  - memory-monitoring
  - log-export

domains:
  primary:
    - src/FluentPDF.Core/Observability/
    - src/FluentPDF.App/Services/Observability/
  secondary:
    - src/FluentPDF.Core/ErrorHandling/

patterns:
  - name: structured-logging
    description: JSON format with timestamp, level, service, event, context
    files:
      - "**/*.cs"
    rule: |
      Use Serilog with structured properties:
      Log.Information("Rendered page {PageNumber} in {Duration}ms", page, ms);

  - name: error-context
    description: PdfError with ErrorCode, Category, Severity, Context
    files:
      - "**/ErrorHandling/*.cs"

  - name: metrics-collection
    description: Use IMetricsCollectionService for performance data
    files:
      - "**/Services/*.cs"

context:
  key_files:
    - src/FluentPDF.Core/Observability/IMetricsCollectionService.cs
    - src/FluentPDF.Core/Observability/ITelemetryService.cs
    - src/FluentPDF.Core/Observability/ILogExportService.cs
    - src/FluentPDF.Core/ErrorHandling/PdfError.cs
    - src/FluentPDF.App/Services/Observability/RenderingObservabilityService.cs
    - src/FluentPDF.App/Services/Observability/MemoryMonitor.cs

  error_categories:
    - File
    - Document
    - Page
    - Permission
    - Format
    - Encoding

  error_severities:
    - Critical
    - Error
    - Warning
    - Information

routing:
  triggers:
    - "log"
    - "metric"
    - "telemetry"
    - "trace"
    - "performance"
    - "memory"
    - "error"
    - "exception"
    - "monitoring"

tools:
  preferred:
    - Read
    - Grep

quality_gates:
  - no-pii-in-logs
  - structured-log-format
  - error-codes-documented
