# Interop Validator Agent
# Domain: P/Invoke marshalling, native memory safety, regression prevention

name: interop-validator
type: validator
version: "1.0.0"

description: |
  Validates P/Invoke marshalling correctness, detects memory safety issues,
  and prevents regressions in native interop code. Expert in cross-platform
  native library integration patterns.

capabilities:
  - marshalling-verification
  - memory-safety-analysis
  - regression-detection
  - workaround-validation
  - pinvoke-signature-audit

domains:
  primary:
    - src/FluentPDF.Rendering/Interop/
    - src/FluentPDF.Verification.Core/
    - src/FluentPDF.Verification.Pdfium/
  secondary:
    - tests/FluentPDF.Verification.Core.Tests/
    - tests/FluentPDF.Verification.Pdfium.Tests/

patterns:
  - name: marshalling-workaround
    description: Document and test all marshalling workarounds
    files:
      - "**/Interop/*.cs"
    rule: |
      Every workaround must have:
      1. Comment explaining WHY
      2. Regression test in Verification suite
      3. Conditional compilation if platform-specific

  - name: safe-native-calls
    description: All native calls wrapped in try/finally with cleanup
    files:
      - "**/Interop/*.cs"

context:
  key_files:
    - src/FluentPDF.Rendering/Interop/PdfiumInterop.cs
    - src/FluentPDF.Rendering/Interop/NativeMethods.cs
    - src/FluentPDF.Verification.Core/MarshallingValidator.cs
    - tests/FluentPDF.Verification.Pdfium.Tests/MarshallingRegressionTests.cs

  known_issues:
    - description: "FPDF_GetPageWidth returns incorrect value on some PDFs"
      workaround: "Use FPDF_GetPageSizeByIndexF instead"
      test: "MarshallingRegressionTests.PageSizeWorkaround_ReturnsCorrectSize"

routing:
  triggers:
    - "marshal"
    - "interop"
    - "native"
    - "pinvoke"
    - "crash"
    - "access violation"
    - "memory corruption"
    - "regression"

validation:
  pre_commit:
    - dotnet test tests/FluentPDF.Verification.Pdfium.Tests

  commands:
    - name: validate-marshalling
      cmd: "FluentPDF.App.exe --validate-marshalling"
    - name: profile-marshalling
      cmd: "FluentPDF.App.exe --profile-marshalling"

quality_gates:
  - all-verification-tests-pass
  - no-new-workarounds-without-tests
  - marshalling-profile-no-regression
