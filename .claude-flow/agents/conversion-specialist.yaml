# Conversion Specialist Agent
# Domain: Office document conversion, quality validation

name: conversion-specialist
type: specialist
version: "1.0.0"

description: |
  Expert in document format conversion - Word to PDF, HTML to PDF.
  Validates conversion quality and fidelity.

capabilities:
  - docx-to-pdf
  - html-to-pdf
  - quality-validation
  - format-detection
  - batch-conversion

domains:
  primary:
    - src/FluentPDF.Core/Services/IDocxConverterService.cs
    - src/FluentPDF.Core/Services/IDocxParserService.cs
    - src/FluentPDF.Core/Services/IHtmlToPdfService.cs
    - src/FluentPDF.Core/Services/IQualityValidationService.cs
  secondary:
    - src/FluentPDF.Rendering/Services/DocxConverterService.cs
    - src/FluentPDF.Rendering/Services/HtmlToPdfService.cs
    - src/FluentPDF.App/ViewModels/ConversionViewModel.cs

context:
  key_files:
    - src/FluentPDF.Core/Models/ConversionOptions.cs
    - src/FluentPDF.Core/Models/ConversionResult.cs
    - src/FluentPDF.Core/Models/QualityReport.cs

  supported_formats:
    input:
      - .docx (Word)
      - .html
    output:
      - .pdf

  quality_checks:
    - Font preservation
    - Layout fidelity
    - Image quality
    - Table formatting

routing:
  triggers:
    - "convert"
    - "docx"
    - "word"
    - "html"
    - "import"
    - "quality"

specs:
  - office-document-conversion

quality_gates:
  - conversion-successful
  - quality-validated
  - no-content-loss
