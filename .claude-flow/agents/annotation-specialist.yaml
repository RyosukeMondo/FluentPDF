# Annotation Specialist Agent
# Domain: PDF annotations, markup, highlights, ink

name: annotation-specialist
type: specialist
version: "1.0.0"

description: |
  Expert in PDF annotation creation, editing, and management.
  Handles highlights, underlines, text notes, shapes, and freehand ink.

capabilities:
  - annotation-creation
  - annotation-editing
  - markup-tools
  - ink-drawing
  - annotation-persistence

domains:
  primary:
    - src/FluentPDF.Core/Services/IAnnotationService.cs
    - src/FluentPDF.Rendering/Services/AnnotationService.cs
    - src/FluentPDF.Rendering/Interop/PdfiumAnnotationInterop.cs
  secondary:
    - src/FluentPDF.App/Controls/AnnotationLayer.xaml
    - src/FluentPDF.App/ViewModels/AnnotationViewModel.cs
    - src/FluentPDF.Core/Models/Annotation.cs

context:
  key_files:
    - src/FluentPDF.Rendering/Interop/PdfiumAnnotationInterop.cs
    - src/FluentPDF.Rendering/Services/AnnotationService.cs
    - src/FluentPDF.Core/Models/Annotation.cs

  annotation_types:
    - Highlight
    - Underline
    - Strikethrough
    - Text (sticky note)
    - Square
    - Circle
    - Ink (freehand)

  pdifum_functions:
    - FPDFPage_CreateAnnot
    - FPDFPage_GetAnnotCount
    - FPDFPage_GetAnnot
    - FPDFAnnot_SetColor
    - FPDFAnnot_SetRect
    - FPDFPage_RemoveAnnot

routing:
  triggers:
    - "annotation"
    - "highlight"
    - "underline"
    - "strikethrough"
    - "sticky note"
    - "markup"
    - "draw"
    - "ink"
    - "shape"

specs:
  - annotation-tools

quality_gates:
  - annotations-saved-correctly
  - colors-preserved
  - bounds-accurate
