# Quality Gates Definition
# Measurable criteria for code quality per domain

version: "1.0.0"
updated: "2026-01-25"

# ============================================================================
# GLOBAL QUALITY GATES
# ============================================================================

global:
  code_metrics:
    max_file_lines: 500
    max_function_lines: 50
    min_test_coverage: 80
    critical_path_coverage: 90

  architecture:
    - name: "layer-separation"
      rule: "Core has no dependency on Rendering or App"
      test: "dotnet test tests/FluentPDF.Architecture.Tests"

    - name: "interface-abstraction"
      rule: "All services have interface in Core, implementation in Rendering/App"

    - name: "di-only"
      rule: "No static service locator, all dependencies injected"

  error_handling:
    - name: "result-pattern"
      rule: "All service operations return Result<T>, not exceptions"

    - name: "structured-errors"
      rule: "All errors use PdfError with ErrorCode and Context"

  logging:
    - name: "json-format"
      rule: "All logs in JSON format with timestamp, level, service, event"

    - name: "no-pii"
      rule: "No personally identifiable information in logs"

    - name: "correlation-ids"
      rule: "All operations include correlation ID for tracing"

# ============================================================================
# DOMAIN-SPECIFIC QUALITY GATES
# ============================================================================

domains:
  # --------------------------------------------------------------------------
  # INTEROP DOMAIN - Highest Standards
  # --------------------------------------------------------------------------
  interop:
    priority: critical
    gates:
      - name: "safe-handle-usage"
        rule: "All native handles wrapped in SafeHandle derivatives"
        validation: "grep -r 'IntPtr.*=' --include='*.cs' src/FluentPDF.Rendering/Interop/ | grep -v SafeHandle"
        expected: "No raw IntPtr assignments"

      - name: "dispose-pattern"
        rule: "All SafeHandle types properly implement disposal"
        test: "tests/FluentPDF.Verification.Pdfium.Tests/HandleDisposalTests.cs"

      - name: "marshalling-validation"
        rule: "All P/Invoke signatures validated"
        command: "FluentPDF.App.exe --validate-marshalling"
        expected_exit: 0

      - name: "workaround-documented"
        rule: "All workarounds documented in known-issues.yaml with regression test"

      - name: "no-memory-leaks"
        rule: "No native memory leaks under normal operation"
        test: "tests/FluentPDF.Verification.Pdfium.Tests/MemoryLeakTests.cs"

    test_coverage:
      minimum: 95
      required_tests:
        - "MarshallingValidation"
        - "HandleDisposal"
        - "MemoryLeak"
        - "ThreadSafety"

  # --------------------------------------------------------------------------
  # RENDERING DOMAIN
  # --------------------------------------------------------------------------
  rendering:
    priority: high
    gates:
      - name: "dpi-awareness"
        rule: "All rendering respects effective DPI"
        test: "tests/FluentPDF.Rendering.Tests/DpiRenderingTests.cs"

      - name: "thread-safety"
        rule: "Document-level locking for PDFium calls"

      - name: "memory-efficiency"
        rule: "Bitmap disposed after use, no accumulation"

      - name: "performance-baseline"
        rule: "Render time within baseline +20%"
        baselines:
          single_page_150dpi: "< 100ms"
          thumbnail_72dpi: "< 50ms"

    test_coverage:
      minimum: 85
      required_tests:
        - "PageRendering"
        - "ThumbnailGeneration"
        - "DpiScaling"
        - "ZoomLevels"

  # --------------------------------------------------------------------------
  # DOCUMENT DOMAIN
  # --------------------------------------------------------------------------
  document:
    priority: high
    gates:
      - name: "data-integrity"
        rule: "No data loss in merge/split/optimize operations"
        test: "tests/FluentPDF.Rendering.Tests/DocumentOperationsTests.cs"

      - name: "progress-reporting"
        rule: "Long operations report progress via IProgress<double>"

      - name: "cancellation-support"
        rule: "All async operations support CancellationToken"

      - name: "validation-before-write"
        rule: "Output validated before overwriting source"

    test_coverage:
      minimum: 85
      required_tests:
        - "MergeDocuments"
        - "SplitDocuments"
        - "OptimizeDocuments"
        - "PageOperations"

  # --------------------------------------------------------------------------
  # FORM DOMAIN
  # --------------------------------------------------------------------------
  form:
    priority: high
    gates:
      - name: "field-detection-complete"
        rule: "All field types detected (text, checkbox, radio, dropdown)"

      - name: "validation-enforced"
        rule: "Required fields validated before save"

      - name: "tab-order-correct"
        rule: "Tab navigation follows PDF tab order"

      - name: "data-persistence"
        rule: "Form data persisted correctly on save"

    test_coverage:
      minimum: 80
      required_tests:
        - "FieldDetection"
        - "FieldValidation"
        - "FormSave"
        - "TabNavigation"

  # --------------------------------------------------------------------------
  # ANNOTATION DOMAIN
  # --------------------------------------------------------------------------
  annotation:
    priority: medium
    gates:
      - name: "annotation-persistence"
        rule: "Annotations saved and restored correctly"

      - name: "color-accuracy"
        rule: "Colors preserved in save/load cycle"

      - name: "bounds-accuracy"
        rule: "Annotation bounds within 1 pixel tolerance"

    test_coverage:
      minimum: 80
      required_tests:
        - "CreateAnnotation"
        - "UpdateAnnotation"
        - "DeleteAnnotation"
        - "SaveAnnotations"

  # --------------------------------------------------------------------------
  # PRESENTATION DOMAIN
  # --------------------------------------------------------------------------
  presentation:
    priority: medium
    gates:
      - name: "mvvm-pattern"
        rule: "ViewModels use ObservableObject and RelayCommand"

      - name: "binding-verification"
        rule: "UI bindings verified with UIBindingVerifier"

      - name: "theme-consistency"
        rule: "Light/dark themes switch correctly"

      - name: "accessibility"
        rule: "Controls have AutomationProperties set"

    test_coverage:
      minimum: 75
      required_tests:
        - "ViewModelCommands"
        - "DataBinding"
        - "ThemeSwitching"

  # --------------------------------------------------------------------------
  # OBSERVABILITY DOMAIN
  # --------------------------------------------------------------------------
  observability:
    priority: medium
    gates:
      - name: "metrics-collection"
        rule: "Key metrics (FPS, memory, render time) collected"

      - name: "log-export"
        rule: "Logs exportable to JSON"

      - name: "performance-level"
        rule: "Performance level (good/warning/critical) calculated"

    test_coverage:
      minimum: 75
      required_tests:
        - "MetricsCollection"
        - "LogExport"
        - "PerformanceLevel"

# ============================================================================
# PRE-COMMIT GATES
# ============================================================================

pre_commit:
  required:
    - name: "build"
      command: "dotnet build src/FluentPDF.Core && dotnet build src/FluentPDF.Rendering"

    - name: "unit-tests"
      command: "dotnet test tests/FluentPDF.Core.Tests --verbosity quiet"

  recommended:
    - name: "architecture-tests"
      command: "dotnet test tests/FluentPDF.Architecture.Tests"

# ============================================================================
# PRE-MERGE GATES
# ============================================================================

pre_merge:
  required:
    - name: "full-build"
      command: "dotnet build src/FluentPDF.App -p:Platform=x64"

    - name: "all-tests"
      command: "dotnet test tests/"

    - name: "marshalling-validation"
      command: "FluentPDF.App.exe --validate-marshalling"

    - name: "architecture-compliance"
      command: "dotnet test tests/FluentPDF.Architecture.Tests"

  recommended:
    - name: "e2e-tests"
      command: "dotnet test tests/FluentPDF.E2E.Tests"

    - name: "verification-suite"
      command: "pwsh tools/verify-rendering.ps1"

# ============================================================================
# QUALITY GATE COMMANDS
# ============================================================================

commands:
  check_all: |
    echo "Running all quality gates..."
    dotnet build src/FluentPDF.App -p:Platform=x64
    dotnet test tests/
    FluentPDF.App.exe --validate-marshalling
    dotnet test tests/FluentPDF.Architecture.Tests

  check_interop: |
    echo "Running interop quality gates..."
    dotnet test tests/FluentPDF.Verification.Pdfium.Tests
    FluentPDF.App.exe --validate-marshalling

  check_rendering: |
    echo "Running rendering quality gates..."
    dotnet test tests/FluentPDF.Rendering.Tests
    FluentPDF.App.exe --test-render "tests/Fixtures/sample.pdf"
