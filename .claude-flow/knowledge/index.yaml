# Knowledge Base Index
# Central index for all FluentPDF project knowledge

version: "1.0.0"
updated: "2026-01-25"

# ============================================================================
# KNOWLEDGE FILES
# ============================================================================

files:
  architecture:
    path: .claude-flow/knowledge/architecture.yaml
    description: "Service dependencies, patterns, and architecture decisions"
    priority: high
    load_on_session_start: true

  known-issues:
    path: .claude-flow/knowledge/known-issues.yaml
    description: "PDFium, QPDF, WinUI 3 known issues and workarounds"
    priority: critical
    load_on_session_start: true

  error-codes:
    path: .claude-flow/knowledge/error-codes.yaml
    description: "Centralized error code registry"
    priority: high
    load_on_session_start: true

  quality-gates:
    path: .claude-flow/knowledge/quality-gates.yaml
    description: "Measurable quality criteria per domain"
    priority: high
    load_on_session_start: false

  performance-baselines:
    path: .claude-flow/knowledge/performance-baselines.yaml
    description: "Performance benchmarks and targets"
    priority: medium
    load_on_session_start: false

  spec-traceability:
    path: .claude-flow/knowledge/spec-traceability.yaml
    description: "Spec to implementation mapping with gaps"
    priority: medium
    load_on_session_start: false

  cli-commands:
    path: .claude-flow/knowledge/cli-commands.yaml
    description: "CLI command reference and examples"
    priority: medium
    load_on_session_start: true

  test-wiring:
    path: .claude-flow/knowledge/test-wiring.yaml
    description: "Test project to domain/agent mapping and routing"
    priority: high
    load_on_session_start: false
    load_when: "testing, debugging, tdd"

# ============================================================================
# QUICK LOOKUP
# ============================================================================

quick_lookup:
  # When encountering these issues, refer to known-issues.yaml
  issues:
    crash: "known-issues.yaml"
    memory_leak: "known-issues.yaml"
    rendering_error: "known-issues.yaml"
    marshalling: "known-issues.yaml"

  # When implementing these features, refer to architecture.yaml
  implementation:
    new_service: "architecture.yaml"
    new_viewmodel: "architecture.yaml"
    interop: "architecture.yaml, known-issues.yaml"

  # When testing, refer to quality-gates.yaml and test-wiring.yaml
  testing:
    quality_check: "quality-gates.yaml"
    performance_test: "performance-baselines.yaml"
    coverage: "quality-gates.yaml"
    test_routing: "test-wiring.yaml"
    domain_tests: "test-wiring.yaml"
    failure_routing: "test-wiring.yaml"

  # When checking spec status, refer to spec-traceability.yaml
  specs:
    implementation_status: "spec-traceability.yaml"
    gaps: "spec-traceability.yaml"
    domain_coverage: "spec-traceability.yaml"

# ============================================================================
# CONTEXT LOADING RULES
# ============================================================================

context_rules:
  # Load these files based on task type
  rendering_task:
    - known-issues.yaml (PDFIUM section)
    - architecture.yaml (rendering services)
    - performance-baselines.yaml (rendering section)

  interop_task:
    - known-issues.yaml (ALL sections)
    - architecture.yaml (interop section)
    - quality-gates.yaml (interop domain)

  form_task:
    - known-issues.yaml (PDFIUM-003, PDFIUM-007)
    - architecture.yaml (form services)
    - spec-traceability.yaml (form-filling)

  ui_task:
    - known-issues.yaml (WINUI section)
    - architecture.yaml (presentation section)
    - quality-gates.yaml (presentation domain)

  performance_task:
    - performance-baselines.yaml (ALL)
    - quality-gates.yaml (ALL)

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================

usage:
  session_start: |
    At session start, load:
    1. architecture.yaml - For understanding service dependencies
    2. known-issues.yaml - For avoiding common pitfalls
    3. error-codes.yaml - For consistent error handling
    4. cli-commands.yaml - For diagnostic commands

  before_interop_change: |
    Before any P/Invoke change:
    1. Review known-issues.yaml for related workarounds
    2. Check quality-gates.yaml interop section
    3. Note regression test requirements

  before_merge: |
    Before merging PR:
    1. Run quality gates from quality-gates.yaml
    2. Check performance against performance-baselines.yaml
    3. Update spec-traceability.yaml if implementing spec

  after_bug_fix: |
    After fixing a bug:
    1. Document in known-issues.yaml if workaround needed
    2. Add regression test reference
    3. Update error-codes.yaml if new error code

# ============================================================================
# KNOWLEDGE MAINTENANCE
# ============================================================================

maintenance:
  update_frequency:
    known-issues: "When new issue discovered or workaround changes"
    error-codes: "When new error codes added"
    quality-gates: "When quality criteria change"
    performance-baselines: "Monthly or after optimization"
    spec-traceability: "After each spec implementation"
    architecture: "After architecture changes"

  review_checklist:
    - "Are all known issues documented with workarounds?"
    - "Are all error codes in the registry?"
    - "Are quality gates measurable and testable?"
    - "Are performance baselines realistic?"
    - "Is spec traceability up to date?"
