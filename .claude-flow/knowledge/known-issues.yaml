# Known Issues & Workarounds Registry
# Document all PDFium/QPDF quirks and their solutions

version: "1.0.0"
updated: "2026-01-25"

# ============================================================================
# PDFIUM KNOWN ISSUES
# ============================================================================

pdfium:
  # --------------------------------------------------------------------------
  # Page Size Issues
  # --------------------------------------------------------------------------
  - id: PDFIUM-001
    title: "FPDF_GetPageWidth returns incorrect value on some PDFs"
    severity: medium
    affected_versions: ["all"]
    symptoms:
      - Page width returned as 0 or incorrect value
      - Affects PDFs with unusual page box definitions
    workaround:
      description: "Use FPDF_GetPageSizeByIndexF instead"
      code: |
        // Instead of:
        // var width = PdfiumInterop.FPDF_GetPageWidth(pageHandle);

        // Use:
        FS_SIZEF size;
        if (PdfiumInterop.FPDF_GetPageSizeByIndexF(docHandle, pageIndex, out size))
        {
            width = size.width;
            height = size.height;
        }
      location: "src/FluentPDF.Rendering/Interop/PdfiumInterop.cs"
    regression_test: "MarshallingRegressionTests.PageSizeWorkaround_ReturnsCorrectSize"
    revisit_condition: "When PDFium updates to version > current"
    added: "2026-01-10"

  # --------------------------------------------------------------------------
  # Memory Management Issues
  # --------------------------------------------------------------------------
  - id: PDFIUM-002
    title: "Page handle must be closed before document handle"
    severity: critical
    affected_versions: ["all"]
    symptoms:
      - Access violation when closing document
      - Memory corruption on repeated open/close
    workaround:
      description: "Always close page handles before document handles"
      code: |
        // CORRECT order:
        pageHandle.Dispose();  // First
        docHandle.Dispose();   // Second

        // SafeHandle implementation enforces this via reference tracking
      location: "src/FluentPDF.Rendering/Interop/SafePdfDocumentHandle.cs"
    regression_test: "MarshallingRegressionTests.HandleDisposal_CorrectOrder"
    revisit_condition: "Never - fundamental PDFium requirement"
    added: "2026-01-10"

  - id: PDFIUM-003
    title: "Form environment must be exited before document close"
    severity: critical
    affected_versions: ["all"]
    symptoms:
      - Crash when closing document with forms
      - Memory leak if form environment not released
    workaround:
      description: "Exit form fill environment before closing document"
      code: |
        formHandle.Dispose();  // FPDFDOC_ExitFormFillEnvironment
        docHandle.Dispose();   // FPDF_CloseDocument
      location: "src/FluentPDF.Rendering/Interop/SafePdfFormHandle.cs"
    regression_test: "FormHandleDisposal_ExitsBeforeDocumentClose"
    revisit_condition: "Never - fundamental PDFium requirement"
    added: "2026-01-10"

  # --------------------------------------------------------------------------
  # Rendering Issues
  # --------------------------------------------------------------------------
  - id: PDFIUM-004
    title: "FPDF_RenderPageBitmap requires specific stride alignment"
    severity: medium
    affected_versions: ["all"]
    symptoms:
      - Corrupted rendering output
      - Shifted/skewed images
    workaround:
      description: "Ensure bitmap stride is 4-byte aligned"
      code: |
        int stride = ((width * 4) + 3) & ~3;  // 4-byte alignment
        var buffer = new byte[stride * height];
      location: "src/FluentPDF.Rendering/Services/PdfRenderingService.cs"
    regression_test: "RenderingTests.BitmapStride_FourByteAligned"
    revisit_condition: "Never - fundamental bitmap requirement"
    added: "2026-01-10"

  - id: PDFIUM-005
    title: "Text rendering requires anti-aliasing flags"
    severity: low
    affected_versions: ["all"]
    symptoms:
      - Jagged text rendering
      - Poor quality at low DPI
    workaround:
      description: "Always set FPDF_ANNOT and text smoothing flags"
      code: |
        const int FPDF_ANNOT = 0x01;
        const int FPDF_LCD_TEXT = 0x02;
        const int FPDF_PRINTING = 0x800;
        int flags = FPDF_ANNOT | FPDF_LCD_TEXT;
      location: "src/FluentPDF.Rendering/Services/PdfRenderingService.cs"
    regression_test: "RenderingTests.TextRendering_Antialiased"
    revisit_condition: "Review when updating render quality settings"
    added: "2026-01-10"

  # --------------------------------------------------------------------------
  # Threading Issues
  # --------------------------------------------------------------------------
  - id: PDFIUM-006
    title: "PDFium is not thread-safe for same document"
    severity: critical
    affected_versions: ["all"]
    symptoms:
      - Random crashes during parallel rendering
      - Corrupted output when rendering multiple pages simultaneously
    workaround:
      description: "Serialize access to same document handle"
      code: |
        private readonly SemaphoreSlim _documentLock = new(1, 1);

        async Task RenderAsync()
        {
            await _documentLock.WaitAsync();
            try { /* render */ }
            finally { _documentLock.Release(); }
        }
      location: "src/FluentPDF.Rendering/Services/PdfRenderingService.cs"
    regression_test: "ThreadingTests.ConcurrentRender_SameDocument_Serialized"
    revisit_condition: "Never - fundamental PDFium limitation"
    added: "2026-01-11"

  # --------------------------------------------------------------------------
  # Annotation Issues
  # --------------------------------------------------------------------------
  - id: PDFIUM-007
    title: "Annotation index changes after deletion"
    severity: medium
    affected_versions: ["all"]
    symptoms:
      - Wrong annotation deleted
      - Index out of bounds after deletion
    workaround:
      description: "Delete annotations in reverse index order"
      code: |
        // Delete from highest index to lowest
        foreach (var index in indicesToDelete.OrderByDescending(i => i))
        {
            FPDFPage_RemoveAnnot(page, index);
        }
      location: "src/FluentPDF.Rendering/Services/AnnotationService.cs"
    regression_test: "AnnotationTests.DeleteMultiple_ReverseOrder"
    revisit_condition: "Never - PDFium annotation index behavior"
    added: "2026-01-11"

# ============================================================================
# QPDF KNOWN ISSUES
# ============================================================================

qpdf:
  - id: QPDF-001
    title: "QPDF job handle must be initialized before use"
    severity: critical
    affected_versions: ["all"]
    symptoms:
      - Null pointer exception
      - Undefined behavior
    workaround:
      description: "Always call qpdf_init before any operation"
      code: |
        var handle = QpdfNative.qpdf_init();
        try { /* operations */ }
        finally { QpdfNative.qpdf_cleanup(ref handle); }
      location: "src/FluentPDF.Rendering/Interop/QpdfNative.cs"
    regression_test: "QpdfTests.HandleInit_BeforeUse"
    revisit_condition: "Never - fundamental QPDF requirement"
    added: "2026-01-10"

  - id: QPDF-002
    title: "Encrypted PDFs require password before merge"
    severity: medium
    affected_versions: ["all"]
    symptoms:
      - Merge fails silently
      - Output PDF corrupted or empty
    workaround:
      description: "Decrypt or provide password before merge operation"
      code: |
        if (isEncrypted)
        {
            return Result.Fail(new PdfError("PDF_ENCRYPTED",
                ErrorCategory.Security,
                "Provide password to merge encrypted PDF"));
        }
      location: "src/FluentPDF.Rendering/Services/DocumentEditingService.cs"
    regression_test: "MergeTests.EncryptedPdf_RequiresPassword"
    revisit_condition: "When adding password prompt feature"
    added: "2026-01-10"

# ============================================================================
# WINUI 3 KNOWN ISSUES
# ============================================================================

winui:
  - id: WINUI-001
    title: "WriteableBitmap requires UI thread for creation"
    severity: medium
    affected_versions: ["all"]
    symptoms:
      - Exception when creating bitmap on background thread
      - UI freeze if created synchronously
    workaround:
      description: "Create WriteableBitmap on UI thread, fill on background"
      code: |
        // On UI thread:
        var bitmap = new WriteableBitmap(width, height);

        // On background thread:
        await Task.Run(() => FillBitmapBuffer(bitmap));

        // Back on UI thread:
        bitmap.Invalidate();
      location: "src/FluentPDF.App/Services/Strategies/WriteableBitmapRenderingStrategy.cs"
    regression_test: "RenderingStrategyTests.WriteableBitmap_UIThread"
    revisit_condition: "Check with WinUI 3 updates"
    added: "2026-01-10"

  - id: WINUI-002
    title: "XamlRoot may be null during initialization"
    severity: low
    affected_versions: ["all"]
    symptoms:
      - NullReferenceException when getting DPI
      - RasterizationScale returns 1.0 incorrectly
    workaround:
      description: "Check XamlRoot and use default DPI if null"
      code: |
        var scale = xamlRoot?.RasterizationScale ?? 1.0;
      location: "src/FluentPDF.Rendering/Services/DpiDetectionService.cs"
    regression_test: "DpiDetectionTests.NullXamlRoot_ReturnsDefault"
    revisit_condition: "Never - defensive programming"
    added: "2026-01-11"

