# Claude-Flow Verification Workflow
# Validates all agents, workflows, hooks, and knowledge files are properly configured

name: claude-flow-verify
version: "1.0.0"
description: Verify claude-flow integration is complete and operational

triggers:
  - "verify integration"
  - "check claude-flow"
  - "validate setup"

topology: mesh
max_agents: 3

phases:
  - name: validate-configuration
    description: Validate all configuration files exist and are valid YAML
    tasks:
      - Verify config.yaml structure
      - Verify domains.yaml completeness
      - Verify all agent definitions
      - Verify all workflow definitions
      - Verify all hook definitions
    checks:
      config:
        - path: .claude-flow/config.yaml
          required_keys: [version, project, swarm, memory, agents, workflows, hooks]

      domains:
        - path: .claude-flow/domains.yaml
          required_keys: [version, project, domains, relationships, bounded_contexts]

      agents:
        required:
          - pdf-rendering-specialist
          - interop-validator
          - ui-coordinator
          - verification-engineer
          - observability-analyst
          - document-operations-specialist
          - form-specialist
          - annotation-specialist
          - content-specialist
          - conversion-specialist

      workflows:
        required:
          - pdf-feature
          - rendering-fix
          - verification-run
          - performance-audit
          - ui-change
          - document-operations
          - form-feature
          - annotation-feature
          - interop-audit
          - observability-setup

      hooks:
        required:
          - pre-task
          - post-edit
          - session-start
          - route

  - name: validate-knowledge
    description: Validate knowledge base files
    depends_on: [validate-configuration]
    tasks:
      - Verify known-issues.yaml has entries
      - Verify error-codes.yaml has categories
      - Verify quality-gates.yaml has domain gates
      - Verify spec-traceability.yaml is current
      - Verify test-wiring.yaml is complete
    checks:
      knowledge:
        - path: .claude-flow/knowledge/known-issues.yaml
          required_sections: [pdfium, qpdf, winui]

        - path: .claude-flow/knowledge/error-codes.yaml
          required_sections: [categories, errors]

        - path: .claude-flow/knowledge/quality-gates.yaml
          required_sections: [global, domains, pre_commit, pre_merge]

        - path: .claude-flow/knowledge/test-wiring.yaml
          required_sections: [test_projects, domain_routing, commands]

        - path: .claude-flow/knowledge/spec-traceability.yaml
          required_sections: [specs, gap_analysis, domain_coverage]

  - name: validate-mcp
    description: Validate MCP server connectivity
    depends_on: [validate-configuration]
    tasks:
      - Check system health
      - Verify memory system operational
      - Verify agent spawn capability
      - Verify workflow execution capability
    mcp_checks:
      - tool: mcp__claude-flow__system_health
        expected: overall=healthy

      - tool: mcp__claude-flow__memory_store
        test_key: "__verification_test__"
        test_value: "test"

      - tool: mcp__claude-flow__memory_retrieve
        expected_key: "__verification_test__"

      - tool: mcp__claude-flow__memory_delete
        key: "__verification_test__"

  - name: validate-tests
    description: Validate test suite coverage
    depends_on: [validate-knowledge]
    tasks:
      - Run architecture tests
      - Verify all domains have tests
      - Check test coverage thresholds
    commands:
      - "dotnet test tests/FluentPDF.Architecture.Tests --verbosity quiet"
      - "dotnet test tests/FluentPDF.Core.Tests --verbosity quiet"

  - name: generate-report
    description: Generate verification report
    depends_on: [validate-mcp, validate-tests]
    tasks:
      - Compile all validation results
      - Generate summary report
      - Store in memory for future reference
    output:
      format: json
      store_key: "claude-flow-verification-report"
      fields:
        - timestamp
        - overall_status
        - config_valid
        - agents_valid
        - workflows_valid
        - hooks_valid
        - knowledge_valid
        - mcp_healthy
        - tests_passing
        - issues

# ============================================================================
# VALIDATION CRITERIA
# ============================================================================

validation:
  overall_pass:
    - config_valid: true
    - domains_valid: true
    - agents_count: ">= 10"
    - workflows_count: ">= 10"
    - hooks_count: ">= 4"
    - knowledge_files_valid: true
    - mcp_healthy: true
    - architecture_tests_pass: true

  warnings:
    - test_coverage_below_threshold
    - spec_traceability_gaps
    - outdated_knowledge_files

# ============================================================================
# CLI VERIFICATION COMMANDS
# ============================================================================

cli_commands:
  quick_check: |
    echo "Claude-Flow Quick Verification"
    echo "=============================="
    test -f .claude-flow/config.yaml && echo "✓ config.yaml exists" || echo "✗ config.yaml missing"
    test -f .claude-flow/domains.yaml && echo "✓ domains.yaml exists" || echo "✗ domains.yaml missing"
    test -d .claude-flow/agents && echo "✓ agents/ exists" || echo "✗ agents/ missing"
    test -d .claude-flow/workflows && echo "✓ workflows/ exists" || echo "✗ workflows/ missing"
    test -d .claude-flow/hooks && echo "✓ hooks/ exists" || echo "✗ hooks/ missing"
    test -d .claude-flow/knowledge && echo "✓ knowledge/ exists" || echo "✗ knowledge/ missing"
    ls .claude-flow/agents/*.yaml 2>/dev/null | wc -l | xargs -I{} echo "  Agents: {} defined"
    ls .claude-flow/workflows/*.yaml 2>/dev/null | wc -l | xargs -I{} echo "  Workflows: {} defined"
    ls .claude-flow/hooks/*.yaml 2>/dev/null | wc -l | xargs -I{} echo "  Hooks: {} defined"

  full_verify: |
    echo "Claude-Flow Full Verification"
    echo "=============================="
    echo ""
    echo "1. Configuration Files"
    echo "----------------------"
    for f in config domains; do
      test -f ".claude-flow/$f.yaml" && echo "  ✓ $f.yaml" || echo "  ✗ $f.yaml MISSING"
    done
    echo ""
    echo "2. Agents (expect 10+)"
    echo "----------------------"
    ls -1 .claude-flow/agents/*.yaml 2>/dev/null | sed 's|.*/||' | sed 's|\.yaml||'
    echo ""
    echo "3. Workflows (expect 10+)"
    echo "-------------------------"
    ls -1 .claude-flow/workflows/*.yaml 2>/dev/null | sed 's|.*/||' | sed 's|\.yaml||'
    echo ""
    echo "4. Hooks (expect 4+)"
    echo "--------------------"
    ls -1 .claude-flow/hooks/*.yaml 2>/dev/null | sed 's|.*/||' | sed 's|\.yaml||'
    echo ""
    echo "5. Knowledge Base"
    echo "-----------------"
    ls -1 .claude-flow/knowledge/*.yaml 2>/dev/null | sed 's|.*/||' | sed 's|\.yaml||'
    echo ""
    echo "6. Test Suite"
    echo "-------------"
    dotnet test tests/FluentPDF.Architecture.Tests --verbosity quiet && echo "  ✓ Architecture tests pass" || echo "  ✗ Architecture tests FAIL"
    dotnet test tests/FluentPDF.Core.Tests --verbosity quiet && echo "  ✓ Core tests pass" || echo "  ✗ Core tests FAIL"
