# UI Change Workflow
# Use for: UI modifications, new controls, theme changes

name: ui-change
version: "1.0.0"
description: Implement UI changes using prototype-first approach

triggers:
  - "ui"
  - "design"
  - "layout"
  - "theme"
  - "control"
  - "view"

topology: mesh
max_agents: 3

phases:
  - name: prototype
    description: Design in React prototype (for complex changes)
    agents:
      - ui-coordinator
    condition: complex_ui_change
    tasks:
      - Start prototype dev server
      - Implement component in React
      - Iterate with hot reload
      - Screenshot final design
    commands:
      - "cd prototype && npm run dev"
    outputs:
      - React component
      - Screenshot of design

  - name: tokens
    description: Update design tokens if needed
    agents:
      - ui-coordinator
    condition: theme_or_style_change
    tasks:
      - Edit design-tokens/tokens.json
      - Generate tokens for both platforms
      - Verify consistency
    commands:
      - "cd prototype && npm run generate-tokens"
    outputs:
      - Updated tokens.json
      - Generated tokens.css
      - Generated Tokens.xaml

  - name: implement
    description: Implement in WinUI 3
    agents:
      - ui-coordinator
      - coder
    depends_on: [prototype, tokens]
    tasks:
      - Create/update ViewModel
      - Implement XAML views
      - Wire data bindings
      - Add WinUI 3 specific features
    reference: docs/component-mapping.md
    outputs:
      - ViewModel
      - XAML views

  - name: validate
    description: Verify UI implementation
    agents:
      - verification-engineer
    depends_on: [implement]
    tasks:
      - Run UI binding verification
      - Test theme switching
      - Check accessibility
      - Run App.Tests
    commands:
      - "dotnet test tests/FluentPDF.App.Tests"
    quality_gates:
      - bindings_verified
      - themes_consistent
      - no_xaml_errors

component_mapping:
  reference: docs/component-mapping.md
  examples:
    - react: "<Button variant='primary'>"
      xaml: "<Button Style='{StaticResource AccentButtonStyle}'>"
    - react: "<div className='panel'>"
      xaml: "<Border Style='{StaticResource CardStyle}'>"

design_tokens:
  source: design-tokens/tokens.json
  outputs:
    react: prototype/src/styles/tokens.css
    xaml: design-tokens/Tokens.xaml
