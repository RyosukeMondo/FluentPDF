# Observability Setup Workflow
# Use for: Logging, metrics, diagnostics panel

name: observability-setup
version: "1.0.0"
description: Implement observability and diagnostics features

triggers:
  - "observability"
  - "diagnostics"
  - "logging"
  - "metrics"
  - "telemetry"

topology: mesh
max_agents: 4

phases:
  - name: services
    description: Implement observability services
    agents:
      - observability-analyst
      - coder
    tasks:
      - Implement IMetricsCollectionService
      - Implement ILogExportService
      - Configure OpenTelemetry
      - Set up Aspire Dashboard integration
    outputs:
      - MetricsCollectionService.cs
      - LogExportService.cs

  - name: models
    description: Define observability models
    agents:
      - observability-analyst
    depends_on: [services]
    tasks:
      - Create PerformanceMetrics model
      - Create LogEntry model
      - Define performance levels
      - Define log filter criteria

  - name: ui
    description: Diagnostics UI controls
    agents:
      - ui-coordinator
      - observability-analyst
    depends_on: [models]
    tasks:
      - Create DiagnosticsPanelControl
      - Create LogViewerControl
      - Implement ViewModels
      - Add keyboard shortcuts (Ctrl+Shift+D/L)
    outputs:
      - DiagnosticsPanelControl.xaml
      - LogViewerControl.xaml
      - DiagnosticsPanelViewModel.cs
      - LogViewerViewModel.cs

  - name: instrumentation
    description: Add instrumentation to services
    agents:
      - pdf-rendering-specialist
      - observability-analyst
    depends_on: [services]
    tasks:
      - Add ActivitySource to rendering
      - Add metrics recording
      - Add correlation IDs
      - Verify OTLP export

validation:
  test_commands:
    - dotnet test tests/FluentPDF.Rendering.Tests --filter "Metrics"
    - dotnet test tests/FluentPDF.App.Tests --filter "Diagnostics"

specs:
  - observability-dashboard
