# Rendering Fix Workflow
# Use for: Debug and fix PDF rendering issues, crashes, visual bugs

name: rendering-fix
version: "1.0.0"
description: Diagnose and fix rendering issues

triggers:
  - "render bug"
  - "crash"
  - "visual issue"
  - "blank page"
  - "wrong output"

topology: mesh
max_agents: 4

phases:
  - name: diagnose
    description: Reproduce and identify root cause
    agents:
      - pdf-rendering-specialist
      - interop-validator
    tasks:
      - Reproduce issue with CLI diagnostic
      - Check marshalling validation
      - Profile rendering pipeline
      - Identify failing component
    commands:
      - "FluentPDF.App.exe --test-render {pdf_path}"
      - "FluentPDF.App.exe --diagnostics --verbose"
      - "FluentPDF.App.exe --validate-marshalling"
    outputs:
      - Reproduction steps
      - Root cause analysis
      - Failing test case

  - name: fix
    description: Implement and test the fix
    agents:
      - pdf-rendering-specialist
      - coder
    depends_on: [diagnose]
    tasks:
      - Write regression test FIRST (TDD)
      - Implement minimal fix
      - Verify marshalling still valid
    patterns:
      - Always add workaround comment if needed
      - Update MarshallingRegressionTests if interop change

  - name: validate
    description: Comprehensive validation
    agents:
      - verification-engineer
      - interop-validator
    depends_on: [fix]
    tasks:
      - Run marshalling validation suite
      - Run E2E tests
      - Test on multiple PDF samples
      - Check memory for leaks
    quality_gates:
      - regression-test-passes
      - no-new-marshalling-issues
      - memory-stable

  - name: document
    description: Document fix and update known issues
    agents:
      - observability-analyst
    depends_on: [validate]
    tasks:
      - Update known_issues if workaround
      - Add to interop-validator context
      - Log fix in metrics

validation:
  pre_merge:
    - dotnet test tests/FluentPDF.Verification.Pdfium.Tests
    - dotnet test tests/FluentPDF.Rendering.Tests
    - "FluentPDF.App.exe --validate-marshalling"

cli_diagnostics:
  - name: test-render
    cmd: "FluentPDF.App.exe --test-render {path}"
    exit_codes:
      0: success
      1: load_failed
      2: render_failed
      3: ui_failed

  - name: validate-marshalling
    cmd: "FluentPDF.App.exe --validate-marshalling"

  - name: profile
    cmd: "FluentPDF.App.exe --profile-marshalling"
