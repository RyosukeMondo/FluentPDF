# Interop Audit Workflow
# Use for: P/Invoke review, marshalling validation, memory safety

name: interop-audit
version: "1.0.0"
description: Audit and validate native interop code

triggers:
  - "interop audit"
  - "marshalling review"
  - "memory safety"
  - "native review"

topology: mesh
max_agents: 3

phases:
  - name: inventory
    description: Inventory all P/Invoke declarations
    agents:
      - interop-validator
    tasks:
      - List all DllImport declarations
      - Identify SafeHandle usage
      - Check for raw IntPtr handling
      - Document native dependencies
    outputs:
      - P/Invoke inventory report

  - name: validation
    description: Run marshalling validation
    agents:
      - interop-validator
      - verification-engineer
    depends_on: [inventory]
    tasks:
      - Run marshalling validation tests
      - Profile memory usage
      - Check for leaks
      - Verify cleanup paths
    commands:
      - "FluentPDF.App.exe --validate-marshalling"
      - "FluentPDF.App.exe --profile-marshalling"
      - "dotnet test tests/FluentPDF.Verification.Pdfium.Tests"

  - name: fix
    description: Fix identified issues
    agents:
      - interop-validator
      - pdf-rendering-specialist
    depends_on: [validation]
    condition: issues_found
    tasks:
      - Add missing SafeHandle wrappers
      - Fix marshalling issues
      - Add regression tests
      - Document workarounds

  - name: report
    description: Generate audit report
    agents:
      - observability-analyst
    depends_on: [validation, fix]
    tasks:
      - Compile findings
      - Update known issues
      - Log to metrics

validation:
  success_criteria:
    - no_raw_intptr_leaks
    - all_handles_disposed
    - regression_tests_pass

specs:
  - pdfium-marshaling-verification
  - pinvoke-marshalling-safety
