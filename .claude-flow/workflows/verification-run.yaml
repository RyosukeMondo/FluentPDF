# Verification Run Workflow
# Use for: Run autonomous verification suite, CI validation

name: verification-run
version: "1.0.0"
description: Execute autonomous verification without UAT

triggers:
  - "verify"
  - "e2e"
  - "validate"
  - "ci check"

topology: hierarchical
max_agents: 3

phases:
  - name: setup
    description: Start verification API server
    agents:
      - verification-engineer
    tasks:
      - Start API server in headless mode
      - Verify health endpoint
      - Prepare test PDFs
    commands:
      - "Start-Process FluentPDF.App.exe -ArgumentList '--api-server --port 5000 --headless'"
      - "curl http://localhost:5000/api/health"

  - name: document-tests
    description: Test document operations
    agents:
      - verification-engineer
    depends_on: [setup]
    tasks:
      - Load test documents via API
      - Verify document info
      - Test document lifecycle
    api_calls:
      - method: POST
        endpoint: /api/document/load
        body: '{"path": "tests/Fixtures/sample.pdf"}'
      - method: GET
        endpoint: /api/document/{id}
      - method: DELETE
        endpoint: /api/document/{id}

  - name: rendering-tests
    description: Validate page rendering
    agents:
      - verification-engineer
      - pdf-rendering-specialist
    depends_on: [document-tests]
    tasks:
      - Render each page to PNG
      - Verify render output
      - Batch verify multiple pages
    api_calls:
      - method: GET
        endpoint: /api/render/{id}/{page}
      - method: POST
        endpoint: /api/verify/render
      - method: POST
        endpoint: /api/verify/batch

  - name: regression-check
    description: Run regression tests
    agents:
      - interop-validator
    depends_on: [rendering-tests]
    tasks:
      - Run marshalling validation
      - Run verification suite tests
      - Compare with baseline
    commands:
      - "dotnet test tests/FluentPDF.Verification.Pdfium.Tests"
      - "dotnet test tests/FluentPDF.E2E.Tests"

  - name: report
    description: Generate verification report
    agents:
      - observability-analyst
    depends_on: [regression-check]
    tasks:
      - Collect test results
      - Generate summary report
      - Log to metrics

validation:
  success_criteria:
    - all_api_endpoints_respond
    - all_renders_succeed
    - no_regression_failures
    - memory_stable

scripts:
  full_verification: "pwsh tools/verify-rendering.ps1"
  quick_check: "curl http://localhost:5000/api/health"
