# Document Operations Workflow
# Use for: Merge, split, optimize, page operations

name: document-operations
version: "1.0.0"
description: Implement document structure operations (merge, split, optimize)

triggers:
  - "merge"
  - "split"
  - "combine"
  - "optimize"
  - "compress"
  - "page operation"

topology: mesh
max_agents: 4

phases:
  - name: analysis
    description: Analyze operation requirements
    agents:
      - document-operations-specialist
      - researcher
    tasks:
      - Identify operation type (merge/split/optimize)
      - Analyze input documents
      - Determine output requirements
      - Check for encrypted PDFs

  - name: implementation
    description: Implement the operation
    agents:
      - document-operations-specialist
      - coder
    depends_on: [analysis]
    tasks:
      - Use QPDF native interop
      - Implement SafeHandle patterns
      - Add progress reporting
      - Handle cancellation
    patterns:
      - Return Result<T> for all operations
      - Log operation metrics with Serilog
      - Validate inputs before processing

  - name: validation
    description: Verify operation result
    agents:
      - verification-engineer
      - interop-validator
    depends_on: [implementation]
    tasks:
      - Verify output PDF integrity
      - Check page counts
      - Validate optimization metrics
      - Test with various PDF types

validation:
  pre_merge:
    - dotnet test tests/FluentPDF.Rendering.Tests
    - dotnet test tests/FluentPDF.Core.Tests

specs:
  - document-structure-operations
  - page-operations
