name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          tools/vcpkg
          libs
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('tools/build-libs.ps1') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Build native libraries
      shell: pwsh
      run: |
        .\tools\build-libs.ps1 -UseCache
      continue-on-error: false

    - name: Build PDFium verification tool
      run: dotnet build src/FluentPDF.Verification.Cli/FluentPDF.Verification.Cli.csproj --configuration Release

    - name: Copy PDFium DLL to verification tool
      shell: pwsh
      run: |
        $pdfiumDll = "libs/x64/bin/pdfium.dll"
        $targetDirs = Get-ChildItem -Path "src/FluentPDF.Verification.Cli/bin/Release" -Directory -Recurse -Filter "net8.0" -ErrorAction SilentlyContinue

        foreach ($dir in $targetDirs) {
          Copy-Item $pdfiumDll $dir.FullName -Force
          Write-Host "Copied pdfium.dll to $($dir.FullName)"
        }

    - name: Run PDFium verification
      shell: pwsh
      run: |
        $verificationExe = Get-ChildItem -Path "src/FluentPDF.Verification.Cli/bin/Release" -Recurse -Filter "FluentPDF.Verification.Cli.exe" | Select-Object -First 1

        if (-not $verificationExe) {
          Write-Error "Verification executable not found"
          exit 1
        }

        Write-Host "Running PDFium verification before main build..."
        Write-Host "Executable: $($verificationExe.FullName)"

        # Create reports directory
        $reportsDir = "verification-reports"
        New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null

        # Run verification with JSON output for artifacts
        $jsonOutput = Join-Path $reportsDir "pdfium-verification.json"
        & $verificationExe.FullName --dll "libs/x64/bin/pdfium.dll" --format json --output $jsonOutput
        $jsonExitCode = $LASTEXITCODE

        # Run verification with console output for logs
        Write-Host "`n=== PDFium Verification Results ==="
        & $verificationExe.FullName --dll "libs/x64/bin/pdfium.dll" --format console
        $consoleExitCode = $LASTEXITCODE
        Write-Host "====================================`n"

        # Use the more severe exit code
        $exitCode = if ($consoleExitCode -ne 0) { $consoleExitCode } else { $jsonExitCode }

        if ($exitCode -ne 0) {
          Write-Error "PDFium verification failed with exit code $exitCode"
          Write-Error "Build blocked due to PDFium signature or behavior errors."
          Write-Error "Check the verification report artifact for detailed analysis."
          exit $exitCode
        }

        Write-Host "✓ PDFium verification passed - proceeding with build"
      continue-on-error: false

    - name: Upload PDFium verification report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pdfium-verification-report
        path: verification-reports/
        retention-days: 30

    - name: Build FluentPDF.App for marshalling verification
      run: dotnet build src/FluentPDF.App/FluentPDF.App.csproj --configuration Release -p:Platform=x64

    - name: Copy PDFium DLL to FluentPDF.App
      shell: pwsh
      run: |
        $pdfiumDll = "libs/x64/bin/pdfium.dll"
        $targetDirs = Get-ChildItem -Path "src/FluentPDF.App/bin/x64/Release" -Directory -Recurse -Filter "net8.0-windows*" -ErrorAction SilentlyContinue

        foreach ($dir in $targetDirs) {
          Copy-Item $pdfiumDll $dir.FullName -Force
          Write-Host "Copied pdfium.dll to $($dir.FullName)"
        }

    - name: Run P/Invoke marshalling verification
      shell: pwsh
      run: |
        $appExe = Get-ChildItem -Path "src/FluentPDF.App/bin/x64/Release" -Recurse -Filter "FluentPDF.App.exe" | Select-Object -First 1

        if (-not $appExe) {
          Write-Error "FluentPDF.App executable not found"
          exit 1
        }

        Write-Host "Running P/Invoke marshalling verification before tests..."
        Write-Host "Executable: $($appExe.FullName)"

        # Create reports directory
        $reportsDir = "marshalling-reports"
        New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null

        # Run marshalling verification
        Write-Host "`n=== P/Invoke Marshalling Verification ==="
        & $appExe.FullName --verify-marshalling
        $verifyExitCode = $LASTEXITCODE
        Write-Host "=========================================`n"

        if ($verifyExitCode -ne 0) {
          Write-Error "P/Invoke marshalling verification failed with exit code $verifyExitCode"
          Write-Error "Build blocked due to marshalling errors."
          Write-Error "Check the marshalling report artifact for detailed analysis."
        }

        # Generate marshalling coverage report
        Write-Host "`n=== Generating Marshalling Coverage Report ==="
        $reportPath = Join-Path $reportsDir "marshalling-coverage.md"
        & $appExe.FullName --marshalling-report --output $reportPath
        $reportExitCode = $LASTEXITCODE
        Write-Host "================================================`n"

        if ($reportExitCode -ne 0) {
          Write-Warning "Marshalling report generation returned exit code $reportExitCode"
        }

        # Display report summary if generated
        if (Test-Path $reportPath) {
          Write-Host "`n=== Marshalling Coverage Report Summary ==="
          Get-Content $reportPath -Head 30
          Write-Host "... (full report in artifact)"
          Write-Host "============================================`n"
        }

        # Fail build if verification failed
        if ($verifyExitCode -ne 0) {
          exit $verifyExitCode
        }

        Write-Host "✓ P/Invoke marshalling verification passed - proceeding with build"
      continue-on-error: false

    - name: Upload marshalling verification report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: marshalling-coverage-report
        path: marshalling-reports/
        retention-days: 30

    - name: Setup Java (for JHOVE)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install PDF validation tools
      shell: pwsh
      run: |
        Write-Host "Installing PDF validation tools..."
        .\tools\validation\install-tools.ps1
      continue-on-error: false

    - name: Verify validation tools
      shell: pwsh
      run: |
        Write-Host "Verifying validation tool installations..."

        # Verify VeraPDF
        $veraPdfExe = "tools\validation\verapdf\verapdf.bat"
        if (Test-Path $veraPdfExe) {
          $veraPdfVersion = & $veraPdfExe --version 2>&1 | Select-Object -First 1
          Write-Host "VeraPDF: $veraPdfVersion"
        } else {
          Write-Error "VeraPDF not found at $veraPdfExe"
          exit 1
        }

        # Verify JHOVE
        $jhoveJar = "tools\validation\jhove\jhove.jar"
        if (Test-Path $jhoveJar) {
          $jhoveVersion = java -jar $jhoveJar -v 2>&1 | Select-Object -First 1
          Write-Host "JHOVE: $jhoveVersion"
        } else {
          Write-Error "JHOVE not found at $jhoveJar"
          exit 1
        }

        # Verify QPDF
        $qpdfExe = "tools\validation\qpdf\bin\qpdf.exe"
        if (Test-Path $qpdfExe) {
          $qpdfVersion = & $qpdfExe --version 2>&1 | Select-Object -First 1
          Write-Host "QPDF: $qpdfVersion"
        } else {
          Write-Error "QPDF not found at $qpdfExe"
          exit 1
        }

        Write-Host "All validation tools verified successfully!"

    - name: Restore NuGet packages
      run: dotnet restore FluentPDF.sln

    - name: Build solution
      run: msbuild FluentPDF.sln /p:Configuration=Release /p:Platform="Any CPU" /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false

    - name: Copy PDFium DLLs to build output
      shell: pwsh
      run: |
        # Copy PDFium DLL to App and Rendering test output directories
        $pdfiumDll = "libs/x64/bin/pdfium.dll"

        if (Test-Path $pdfiumDll) {
          # Copy to App bin (WinUI)
          $appDirs = Get-ChildItem -Path "src/FluentPDF.App/bin/Release" -Directory -Recurse -Filter "net8.0-windows*"
          foreach ($dir in $appDirs) {
            Copy-Item $pdfiumDll $dir.FullName -Force
            Write-Host "Copied pdfium.dll to $($dir.FullName)"
          }

          # Copy to Rendering test bin
          $renderingTestDirs = Get-ChildItem -Path "tests/FluentPDF.Rendering.Tests/bin/Release" -Directory -Recurse -Filter "net8.0"
          foreach ($dir in $renderingTestDirs) {
            Copy-Item $pdfiumDll $dir.FullName -Force
            Write-Host "Copied pdfium.dll to $($dir.FullName)"
          }

          # Copy to App test bin (if exists)
          if (Test-Path "tests/FluentPDF.App.Tests") {
            $appTestDirs = Get-ChildItem -Path "tests/FluentPDF.App.Tests/bin/Release" -Directory -Recurse -Filter "net8.0-windows*"
            foreach ($dir in $appTestDirs) {
              Copy-Item $pdfiumDll $dir.FullName -Force
              Write-Host "Copied pdfium.dll to $($dir.FullName)"
            }
          }
        } else {
          Write-Error "PDFium DLL not found at $pdfiumDll"
          exit 1
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FluentPDF-Build
        path: |
          src/FluentPDF.App/bin/Release
          src/FluentPDF.Core/bin/Release
          src/FluentPDF.Rendering/bin/Release
          libs/x64/bin/pdfium.dll
        retention-days: 7
